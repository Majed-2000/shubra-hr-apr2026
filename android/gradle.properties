org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
android.enableJetifier=true
android.ndkVersion=27.0.12077973

# Disable Kotlin compile daemon — kept failing to connect on Windows and the
# build fell back to in-process anyway. In-process reuses Gradle's existing
# 8GB JVM heap, so no perf loss. Removes 4x "Could not connect to Kotlin
# compile daemon" stack traces per build.
kotlin.compiler.execution.strategy=in-process

# Belt-and-suspenders: if the daemon strategy is ever re-enabled, ensure the
# daemon process has enough heap to start.
kotlin.daemon.jvm.options=-Xmx2G -XX:MaxMetaspaceSize=512m
